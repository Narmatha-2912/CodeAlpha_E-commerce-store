<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE | Online Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>LUXE.</h2>
        <nav>
            <a href="#">Home</a>
            <a href="#products">Shop</a>
            <a href="#about">About</a>
        </nav>
        <button class="cart">🛒 Cart (<span id="cart-count">0</span>)</button>
    </header>

    <section class="hero">
        <div>
            <p>NEW COLLECTION 2026</p>
            <h1>Style that<br>speaks for you.</h1>
            <p>Discover products you'll love.</p>
            <a href="#products" class="shop-btn">Shop Now →</a>
        </div>
    </section>

    <main id="products">
        <h2>Our Collection</h2>
        <input type="text" id="search"
               placeholder="Search products...">

        <div class="products" id="product-list"></div>
    </main>

    <section id="about">
        <h2>About LUXE</h2>
        <p>Quality products. Beautiful experiences. Everyday style.</p>
    </section>

    <footer>
        © 2026 LUXE. All rights reserved.
    </footer>

    <script src="script.js"></script>
</body>
</html>
<!DOCTYPE html>
